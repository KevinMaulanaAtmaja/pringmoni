name: pringmoni-test

services:
  db-test:
    image: postgres:16-alpine
    container_name: pringmoni-test-db
    restart: "no"
    environment:
      POSTGRES_DB: ${TEST_DB_NAME:-pringmoni_test}
      POSTGRES_USER: ${TEST_DB_USER:-pringmoni}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-pringmoni}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    shm_size: 256mb
    tmpfs:
      - /var/lib/postgresql/data
    stop_grace_period: 5s
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - max_connections=100
